name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install PlantUML runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless graphviz

      - name: Download PlantUML jar
        run: |
          mkdir -p .cache
          curl -L --fail --retry 3 \
            -o .cache/plantuml.jar \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.8/plantuml-1.2024.8.jar

      - name: Render PlantUML diagrams
        run: npm run render:plantuml

      - name: Build
        run: npm run build

      - name: Upload PlantUML render logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-render-logs
          path: |
            logs/plantuml-render.log
            public/plantuml/render-log.json
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
