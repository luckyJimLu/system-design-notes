name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install dependencies
        run: npm ci

      - name: Restore PlantUML and CJK font cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/plantuml.jar
            .cache/fonts
          key: plantuml-runtime-${{ runner.os }}-${{ hashFiles('scripts/setup-plantuml.sh') }}

      - name: Setup PlantUML runtime
        run: bash scripts/setup-plantuml.sh

      - name: Validate committed content before rendering
        run: npm run validate:content

      - name: Render PlantUML diagrams
        run: npm run render:diagrams -- --force

      - name: Validate committed diagram assets
        run: npm run validate:content

      - name: Type check
        run: npm run lint

      - name: Install pinned Boost teaching headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost1.83-dev

      - name: Compile and run C++ architecture examples
        run: bash scripts/check-cpp-examples.sh

      - name: Build
        run: npm run build

      - name: Upload PlantUML render logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-render-logs
          path: |
            logs/plantuml-render.log
          if-no-files-found: ignore

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
