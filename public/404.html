<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Notes</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Preserves paths and converts them to hash routes
      (function() {
        var location = window.location;
        var pathname = location.pathname;
        // Repository name on GitHub Pages
        var repoName = '/system-design-notes';
        var subPath = pathname;
        if (subPath.startsWith(repoName)) {
          subPath = subPath.slice(repoName.length);
        }
        subPath = subPath.replace(/^\//, '');

        var targetHash = location.hash;
        if (subPath && !targetHash) {
          targetHash = '#/chapter/' + subPath.replace(/^chapter\//, '');
        }

        var redirectUrl = (pathname.startsWith(repoName) ? repoName + '/' : '/') + (targetHash || '');
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fafafa; color: #525252;">
    <p>Redirecting to System Design Notes...</p>
  </body>
</html>
